<body><main><header><svg width="44" height="44" viewBox="0 0 1024 1024" aria-hidden="true"><rect width="1024" height="1024" rx="260" fill="#E9F6F0"/><path d="M744 280H456C359 280 280 359 280 456V568C280 665 359 744 456 744H744" fill="none" stroke="#173F3A" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"/><rect x="428" y="420" width="208" height="184" rx="54" fill="#269C80"/><rect x="732" y="468" width="88" height="88" rx="32" fill="#173F3A"/></svg><div>栖核 <small>CoreNest</small></div><span class="badge">设备配对</span></header>
<section class="intro"><p class="eyebrow">YOUR BOARD, WITHIN REACH</p><h1>让连接，<br>从一次扫码开始。</h1><p>打开 iPhone 上的栖核，进入「设置 → 扫码绑定」。<br>扫描右侧二维码，核对双方验证码后确认。</p><ol><li>手机扫描限时二维码</li><li>核对手机与此页的六位验证码</li><li>在此页批准，完成安全绑定</li></ol><div class="safety">独立设备凭据 · 本机生成二维码 · 可随时撤销</div></section>
<section class="card" aria-label="配对状态"><div class="card-top"><span id="state">准备配对</span><span id="timer"></span></div><div class="qr" id="visual"><img id="qr" alt="使用栖核 App 扫描的设备配对二维码" hidden><span id="placeholder">正在加载…</span></div><h2 id="headline">仅连接你信任的设备</h2><p id="detail">二维码将在五分钟内失效。</p><code id="code" hidden></code><div id="decision" hidden><button id="approve">验证码一致，批准绑定</button><button id="reject" class="secondary">拒绝此请求</button></div><div class="endpoint" id="endpoint"></div><p class="footnote" id="role">默认只读，不会修改校园网或重启主板。</p></section>
