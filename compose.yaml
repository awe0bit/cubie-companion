name: corenest
services:
  server:
    image: corenest-server:0.7.0
    build: .
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',18766),3); s.sendall(b'GET /pair HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n'); assert b' 200 ' in s.makefile('rb').readline(128); s.close()"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    ports:
      - "127.0.0.1:18766:18766"
    volumes:
      - state:/data
      - type: bind
        source: /run/corenest-host
        target: /host-telemetry
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=8m,mode=1777
    logging:
      driver: json-file
      options: {max-size: 2m, max-file: "2"}
volumes:
  state:
